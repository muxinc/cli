<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <!--
      Deliberately self-contained: no scripts, no external stylesheets, fonts,
      or images. This page is served by a short-lived loopback server during
      `mux login`, and a page holding an authorization code must not be able to
      talk to anything else. Keep it that way.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --fg: #111111;
        --fg-muted: #555555;
        --bg: #ffffff;
        --border: #e4e4e7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f4f4f5;
          --fg-muted: #a1a1aa;
          --bg: #18181b;
          --border: #3f3f46;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 26rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
      }

      p {
        margin: 0;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{title}}</h1>
      <p>{{message}}</p>
    </main>
  </body>
</html>
