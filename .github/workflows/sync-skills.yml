name: Sync agent skills

# Keeps skill/ in sync with the agent skills published in muxinc/mux-skills.
# Triggered by a repository_dispatch from that repo on skill changes, with a
# weekly cron as a backstop and workflow_dispatch for manual runs. Opens a PR
# only when the synced content actually changed.

on:
  repository_dispatch:
    types: [skills-updated]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out muxinc/mux-skills
        uses: actions/checkout@v4
        with:
          repository: muxinc/mux-skills
          path: .skills-src

      - uses: oven-sh/setup-bun@v2

      - name: Copy skills into skill/
        run: |
          set -euo pipefail
          SKILLS_SHA=$(git -C .skills-src log -1 --format=%H -- plugins/mux/skills)
          rm -rf skill
          mkdir -p skill
          for dir in .skills-src/plugins/mux/skills/*/; do
            name=$(basename "$dir")
            mkdir -p "skill/$name"
            cp "$dir/SKILL.md" "skill/$name/"
            if [ -d "$dir/references" ]; then
              cp -R "$dir/references" "skill/$name/"
            fi
          done
          printf '{\n  "source": "muxinc/mux-skills",\n  "commit": "%s"\n}\n' "$SKILLS_SHA" > skill/manifest.json
          rm -rf .skills-src

      - name: Regenerate embedded skills module
        run: bun scripts/generate-embedded-skills.ts

      - name: Verify embedded module matches skill/
        run: bun test src/lib/embedded-skills.test.ts

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync agent skills from muxinc/mux-skills'
          title: 'Sync agent skills from muxinc/mux-skills'
          body: |
            Automated sync of the agent skills embedded in the CLI from
            [muxinc/mux-skills](https://github.com/muxinc/mux-skills). The source
            commit is recorded in `skill/manifest.json`.

            The next tagged release will embed these files in the compiled
            binaries via `src/lib/embedded-skills.gen.ts`.
          branch: chore/sync-agent-skills
          delete-branch: true
